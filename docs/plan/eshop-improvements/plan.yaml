plan_id: eshop-improvements
objective: Implement prioritized improvements from IMPROVEMENTS.md, focusing on Phase 0 (Guardrails) and Phase 1 (Consistency and Reliability), and log completion status back to IMPROVEMENTS.md.
created_at: "2026-04-02"
created_by: gem-planner
status: pending_approval
research_confidence: high

plan_metrics:
  wave_1_task_count: 4
  total_dependencies: 13
  risk_score: high

tldr: |
  This plan executes the requested improvements in three waves with explicit dependency control.
  Wave 1 applies critical guardrails and CI/test determinism fixes with no blockers.
  Wave 2 standardizes cancellation and endpoint behavior consistency across APIs and service defaults.
  Wave 3 applies a higher-risk infrastructure optimization (DbContext pooling) only after Wave 2 stabilizes,
  then records all implementation status entries in IMPROVEMENTS.md.
open_questions: []

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Identity signing credentials remain dev-grade in non-development environments due to incorrect guard placement.
      likelihood: medium
      impact: critical
      mitigation: Require explicit IsDevelopment guard around developer key settings and include TODO placeholder for production signing credentials.
    - scenario: CancellationToken propagation is only partially applied, causing hanging requests or delayed shutdown under load.
      likelihood: medium
      impact: high
      mitigation: Add CancellationToken to every async handler signature in Ordering and Catalog APIs and thread through all I/O calls in one pass.
    - scenario: Health endpoint exposure change leaks detailed dependency health publicly.
      likelihood: medium
      impact: high
      mitigation: Keep detailed /health endpoint development-only, expose lightweight /alive and dependency-based /ready with safe response shape for all environments.
    - scenario: Switching to AddDbContextPool breaks runtime due to constructor incompatibility or context state assumptions.
      likelihood: medium
      impact: high
      mitigation: Validate OrderingContext constructor compatibility first, then switch registration and run targeted functional tests before status logging.
    - scenario: CI changes fail due to incorrect coverage collection or codecov upload configuration.
      likelihood: low
      impact: medium
      mitigation: Add coverage collection flags to test command and insert post-test codecov step with repository-secret-based token strategy.
  assumptions:
    - Existing CI secrets and permissions support codecov upload.
    - No out-of-band architectural constraints block adding /ready endpoint in service defaults.
    - Ordering and Catalog async handlers already use I/O APIs that accept CancellationToken.
    - IMPROVEMENTS.md status section can be updated without changing roadmap intent.

implementation_specification:
  code_structure: Apply focused, minimal edits in existing API composition files and fixtures; introduce reusable endpoint filter for requestId validation; preserve current route grouping and API versioning styles.
  affected_areas:
    - src/Identity.API/Program.cs
    - eShop.Web.slnf
    - .github/workflows/pr-validation.yml
    - tests/Catalog.FunctionalTests/CatalogApiFixture.cs
    - src/Ordering.API/Apis/OrdersApi.cs
    - src/eShop.ServiceDefaults/Extensions.cs
    - src/Catalog.API/Apis/CatalogApi.cs
    - src/Ordering.API/Extensions/Extensions.cs
    - src/Ordering.Infrastructure/OrderingContext.cs
    - IMPROVEMENTS.md
  component_details:
    - component: Identity credential configuration
      responsibility: Ensure dev-only key management and signing credentials are gated to development environments.
      interfaces:
        - Program.cs identity server setup block
    - component: Solution filter completeness
      responsibility: Include ClientApp unit tests project in web solution filter to improve developer test visibility.
      interfaces:
        - eShop.Web.slnf projects list
    - component: PR validation coverage workflow
      responsibility: Collect cross-platform code coverage and publish it through codecov after tests.
      interfaces:
        - pr-validation workflow test and upload steps
    - component: Functional test container determinism
      responsibility: Pin pgvector image tag to stable semver to avoid drifting latest tag behavior.
      interfaces:
        - CatalogApiFixture postgres container configuration
    - component: Orders API request lifecycle consistency
      responsibility: Add cancellation token propagation and centralized requestId validation for all relevant endpoints.
      interfaces:
        - Orders API handler signatures
        - Reusable IEndpointFilter for requestId
    - component: Service health endpoints
      responsibility: Provide safe always-on liveness and readiness endpoints while preserving detailed development-only diagnostics.
      interfaces:
        - MapDefaultEndpoints health endpoint mapping
    - component: Catalog API cancellation propagation
      responsibility: Add cancellation token support to all async catalog handlers and downstream calls.
      interfaces:
        - Catalog API endpoint handlers
    - component: Ordering DbContext pooling
      responsibility: Enable DbContext pooling after constructor compatibility correction in OrderingContext.
      interfaces:
        - AddOrderingServices registration path
        - OrderingContext constructors
    - component: Improvement tracking document
      responsibility: Mark completion status of implemented items for roadmap traceability.
      interfaces:
        - IMPROVEMENTS.md status/log entries
  dependencies:
    - component: task-005
      relationship: Provides cancellation-safe Orders API handlers needed before pooling stabilization verification in task-009.
    - component: task-006
      relationship: Removes duplicated requestId checks and stabilizes endpoint behavior before Wave 3 reliability work.
    - component: task-007
      relationship: Establishes final health endpoint contract before completion logging.
    - component: task-008
      relationship: Aligns cancellation semantics across APIs before final consistency validation and logging.
  integration_points:
    - Existing minimal API route groups and endpoint mapping in Ordering and Catalog APIs
    - Existing service default endpoint mapping in eShop.ServiceDefaults
    - Existing CI workflow in GitHub Actions
    - Existing functional test fixtures using containerized dependencies

