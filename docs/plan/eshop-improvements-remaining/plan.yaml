plan_id: eshop-improvements-remaining
objective: Implement the next practical roadmap wave after Phase 0-1 by expanding Playwright coverage, adding local troubleshooting and ADR documentation, improving local run output, and updating roadmap status with targeted validation.
created_at: "2026-04-02"
created_by: gem-planner
status: pending_approval
research_confidence: high

plan_metrics:
  wave_1_task_count: 5
  total_dependencies: 8
  risk_score: medium

tldr: |
  This follow-on plan executes a low-risk, high-value wave focused on testing breadth and developer experience.
  Wave 1 delivers independent artifacts in parallel: new Playwright scenarios, CI-safe browser project configuration,
  local troubleshooting docs, ADRs, and improved local startup output.
  Wave 2 updates CI browser execution and roadmap status once the base artifacts are in place.
  Wave 3 runs targeted validation checks to confirm syntax and document integrity before completion.
open_questions: []

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: New Playwright tests are flaky due to environment timing and auth/session setup coupling.
      likelihood: medium
      impact: high
      mitigation: Reuse existing login setup flow and keep scenarios limited to stable existing user paths with deterministic waits.
    - scenario: Firefox/WebKit enablement causes CI instability or excessive runtime by running locally and in CI unexpectedly.
      likelihood: medium
      impact: medium
      mitigation: Gate non-Chromium projects behind CI-only project settings and keep local default execution unchanged.
    - scenario: Run script summary output drifts from actual endpoints and misleads developers.
      likelihood: low
      impact: medium
      mitigation: Print clearly labeled expected endpoints and include an estimate note plus Aspire dashboard hint rather than asserting readiness.
  assumptions:
    - Existing e2e login setup and baseline specs remain valid and reusable.
    - GitHub Actions runners can install required Playwright browser dependencies for Firefox/WebKit.
    - Markdown additions are documentation-only and do not require architecture review approval in this pass.

implementation_specification:
  code_structure: Keep changes additive and localized to test specs, Playwright config/workflow, documentation, and local script output; avoid behavioral backend changes.
  affected_areas:
    - e2e/
    - playwright.config.ts
    - .github/workflows/playwright.yml
    - docs/LOCAL_SETUP.md
    - docs/adr/
    - build/local/run-local.ps1
    - IMPROVEMENTS.md
  component_details:
    - component: Playwright scenario expansion
      responsibility: Add at least two high-value E2E scenarios for checkout/auth/session or cart persistence using existing app flows.
      interfaces:
        - New spec files under e2e/*.spec.ts
        - Existing setup dependency via e2e/login.setup.ts
    - component: CI-only browser coverage configuration
      responsibility: Add Firefox/WebKit projects that run in CI context without burdening local default runs.
      interfaces:
        - playwright.config.ts projects list and conditional execution flags
    - component: GitHub Actions browser execution
      responsibility: Ensure workflow installs required browsers and executes broader browser coverage via matrix or equivalent.
      interfaces:
        - .github/workflows/playwright.yml job strategy and install/test steps
    - component: Local developer troubleshooting guide
      responsibility: Document prerequisites, common issues, health URLs, Aspire access, and run modes.
      interfaces:
        - docs/LOCAL_SETUP.md
    - component: Architecture decision records
      responsibility: Capture ADR-001 through ADR-004 for key architectural tradeoffs referenced in roadmap.
      interfaces:
        - docs/adr/ADR-001.md
        - docs/adr/ADR-002.md
        - docs/adr/ADR-003.md
        - docs/adr/ADR-004.md
    - component: Local run script startup summary
      responsibility: Print startup summary table, estimated startup note, and Aspire dashboard URL hint for local runs.
      interfaces:
        - build/local/run-local.ps1 console output block
    - component: Improvement tracker status update
      responsibility: Mark this wave items as done/partial in roadmap status log.
      interfaces:
        - IMPROVEMENTS.md implementation status log and phase checkboxes
    - component: Targeted validation checks
      responsibility: Run quick syntax/sanity validation for Playwright config and markdown docs and capture outcomes.
      interfaces:
        - package.json script usage or direct npx/node checks
        - markdown lint/parser command if available
  dependencies:
    - component: task-r2
      relationship: Provides CI-only project definitions consumed by workflow updates in task-r3.
    - component: task-r1
      relationship: Supplies additional specs that browser-matrix workflow validates in task-r3 and task-r8.
    - component: task-r4
      relationship: Provides troubleshooting documentation content referenced by roadmap status update in task-r7.
    - component: task-r5
      relationship: Provides ADR artifacts that must be reflected in roadmap status update in task-r7.
    - component: task-r6
      relationship: Provides script UX improvements that must be reflected in roadmap status update in task-r7.
  integration_points:
    - Existing Playwright setup project and auth storage state flow
    - Existing GitHub Actions Playwright workflow
    - Existing local run entrypoint script for AppHost
    - Existing roadmap phase/checklist sections in IMPROVEMENTS.md

contracts:
  - from_task: task-r1
    to_task: task-r8
    interface: New specs execute through existing setup and pass syntax/runtime smoke checks.
    format: Playwright spec contract (.spec.ts test definitions)
  - from_task: task-r2
    to_task: task-r3
    interface: CI-only browser projects are available for workflow selection or unified execution.
    format: Playwright project names and env-gated config contract
  - from_task: task-r3
    to_task: task-r8
    interface: Workflow syntax and command validity are checkable via quick config/lint parsing.
    format: GitHub workflow YAML and command contract
  - from_task: task-r4
    to_task: task-r7
    interface: Troubleshooting guide existence and scope coverage can be marked in status log.
    format: Markdown doc completion contract
  - from_task: task-r5
    to_task: task-r7
    interface: ADR set ADR-001..ADR-004 exists with requested decision topics.
    format: ADR markdown file set contract
  - from_task: task-r6
    to_task: task-r7
    interface: Script emits summary table and Aspire hint text for local startup UX.
    format: PowerShell output behavior contract
  - from_task: task-r7
    to_task: task-r8
    interface: Updated roadmap status is included in final validation sweep.
    format: Markdown consistency contract

