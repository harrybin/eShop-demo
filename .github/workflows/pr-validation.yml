name: eShop Pull Request Validation

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "src/ClientApp/**"
      - "tests/ClientApp.UnitTests/**"
      - ".github/workflows/pr-validation-maui.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "src/ClientApp/**"
      - "tests/ClientApp.UnitTests/**"
      - ".github/workflows/pr-validation-maui.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - name: Build
        run: dotnet build eShop.Web.slnf
      - name: Test
        run: dotnet test --solution eShop.Web.slnf --no-build --no-progress --output detailed --collect:"XPlat Code Coverage"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
